site_name: Terradue AsyncAPI Mate
site_url: https://Terradue.github.io/asyncapi-mate/
site_author: Fabrice Brito, Simone Tripodi
repo_url: https://github.com/Terradue/asyncapi-mate/
repo_name: Terradue/asyncapi-mate

theme:
  name: material

  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    toggle:
      icon: material/toggle-switch-off-outline
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    toggle:
      icon: material/toggle-switch
      name: Switch to light mode

plugins:
  - search
  - mermaid2:
      version: 10.6.0

markdown_extensions:
  - pymdownx.details
  - abbr
  - admonition
  - footnotes
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - attr_list
  - pymdownx.snippets:
      base_path: './'
  - pymdownx.highlight:
      line_spans: __span

nav:
  - Home: index.md
  - Tutorials:
      - Your first pipeline: tutorials/first-pipeline.md
  - How-to guides:
      - Describe applications: how-to/describe-applications.md
      - Regenerate documentation: how-to/regenerate.md
      - Integrate the output: how-to/integrate-output.md
  - Reference:
      - CLI: cli.md
      - Input document: reference/input.md
      - Generated output: reference/output.md
      - Payload diagrams: reference/schema-support.md
  - Explanation:
      - How rendering works: explanation/rendering.md

copyright: <a href="https://www.apache.org/licenses/LICENSE-2.0"><img src="https://img.shields.io/badge/license-Apache%20License%202.0-blue"" alt="Apache License, Version 2.0" /></a>
